    RequirementDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        decision:
          $ref: '#/components/schemas/Decision'
        comment:
          type:
          - string
          - 'null'
        expectedRequirementLockVersion:
          $ref: '#/components/schemas/LockVersion'
      required:
      - decision
      - expectedRequirementLockVersion
      description: REJECT或REQUEST_CHANGES必填非空comment；APPROVE可为空；reviewId指向轮次，reviewer由会话确定。
      allOf:
      - if:
          properties:
            decision:
              enum:
              - REJECT
              - REQUEST_CHANGES
          required:
          - decision
        then:
          required:
          - comment
          properties:
            comment:
              type: string
              minLength: 1
              pattern: .*\S.*
    ChangeDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        decision:
          $ref: '#/components/schemas/Decision'
        comment:
          type:
          - string
          - 'null'
        expectedChangeLockVersion:
          $ref: '#/components/schemas/LockVersion'
      required:
      - decision
      - expectedChangeLockVersion
      description: REJECT或REQUEST_CHANGES必填comment；reviewer由会话确定，完成轮次只一次。
      allOf:
      - if:
          properties:
            decision:
              enum:
              - REJECT
              - REQUEST_CHANGES
          required:
