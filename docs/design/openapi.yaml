          pattern: ^[1-9][0-9]*$
          maxLength: 19
          description: SQL signed BIGINT正整数十进制字符串；服务端再校验<=9223372036854775807，避免JavaScript Number精度丢失。
        tagIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          uniqueItems: true
        expectedLockVersion:
          $ref: '#/components/schemas/LockVersion'
      required:
      - expectedLockVersion
      description: 至少assigneeId或tagIds之一；省略不改，assigneeId=null清除；tagIds替换当前集合，不产生正式版本。
      anyOf:
      - required:
        - assigneeId
      - required:
        - tagIds
    CreateTagRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 50
          minLength: 1
          pattern: .*\S.*
        description:
          type:
          - string
          - 'null'
          maxLength: 500
      required:
      - name
    EditTagRequest:
      type: object
      additionalProperties: false
